name: docker

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      ytdlp_version:
        description: yt-dlp version to bake in
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: resolve yt-dlp version
        id: ytdlp
        run: |
          set -euo pipefail
          version="${{ inputs.ytdlp_version }}"
          if [ -z "${version}" ]; then
            version="$(curl -fsSL https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest \
              | grep -oE '"tag_name": *"[^"]+"' | head -1 | cut -d'"' -f4)"
          fi
          if [ -z "${version}" ]; then
            echo "could not resolve a yt-dlp version" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "baking in yt-dlp ${version}"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # latest has to move on a release and on the weekly rebuild.
            # is_default_branch would not do it: a tag push is not a branch,
            # so a fresh release would never become latest at all
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.event_name == 'schedule' }}
            type=schedule,pattern=nightly

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            YTDLP_VERSION=${{ steps.ytdlp.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test the image
        run: |
          set -euo pipefail
          tag="$(echo '${{ steps.meta.outputs.tags }}' | head -1)"
          docker run --rm "${tag}" --version
          docker run --rm --entrypoint yt-dlp "${tag}" --version
          docker run --rm --entrypoint ffmpeg "${tag}" -version | head -1
